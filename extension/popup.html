<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 330px;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 55%, #ec4899 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 6px 14px -3px rgba(99, 102, 241, 0.4);
      flex-shrink: 0;
    }
    .brand-title {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.3px;
      color: #0f172a;
    }
    .brand-sub {
      font-size: 11.5px;
      color: #6366f1;
      font-weight: 600;
    }
    .status-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      margin-right: 6px;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }
    .status-dot.offline {
      background: #f43f5e;
      box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.15);
    }
    input {
      width: 100%;
      padding: 10px 12px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      color: #1e293b;
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      margin-top: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.28);
    }
    .btn-primary:hover {
      filter: brightness(1.05);
    }
    .btn-secondary {
      background: #ffffff;
      border-color: #e2e8f0;
      color: #475569;
    }
    .btn-secondary:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
        <path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/>
      </svg>
    </div>
    <div>
      <div class="brand-title">Downly</div>
      <div class="brand-sub">Smart Download Accelerator</div>
    </div>
  </div>

  <div class="status-card">
    <span id="daemonStatus"><span class="status-dot"></span> Checking engine...</span>
    <span style="color: #6366f1; font-size: 11px; font-weight: 600;">Port 8080</span>
  </div>

  <input type="text" id="urlInput" placeholder="Paste file or video URL here...">
  <button class="btn btn-primary" id="startBtn">Download with Downly</button>
  <button class="btn btn-secondary" id="dashBtn">Open Downly Workspace</button>

  <script src="popup.js"></script>
</body>
</html>
